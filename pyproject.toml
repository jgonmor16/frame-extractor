[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-extractor"
description = "Extract frames from a video within a time range, using ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No third-party runtime dependencies: ffmpeg and ffprobe are external
# binaries, checked for at runtime rather than installed by pip.
dependencies = []
# Sourced from frame_extractor.__version__ so the version lives in exactly
# one place and cannot drift between the package and its metadata.
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "build>=1.0"]

[project.scripts]
frame-extractor = "frame_extractor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "frame_extractor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, PTH prefer pathlib, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# The test suite monkeypatches module attributes, which strict mode
# cannot always follow.
module = "tests.*"
disallow_untyped_decorators = false
