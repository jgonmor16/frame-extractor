name: publish

# Runs when a GitHub release is published, so cutting the release and
# shipping it are one action rather than two that can disagree.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tooling
        run: pip install build twine

      - name: Build the sdist and wheel
        run: make build

      - name: Check the metadata renders on PyPI
        run: twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Named so the deployment shows up on the repository page, and so a
    # protection rule can be attached to it later if wanted.
    environment:
      name: pypi
      url: https://pypi.org/p/frame-extractor-ffmpeg

    permissions:
      # Mandatory for trusted publishing, and granted here rather than at
      # the workflow level so the build job cannot mint a token.
      id-token: write

    # Nothing else belongs in this job: it downloads the artefact built
    # above and uploads it, so the credential is exposed to as little as
    # possible.
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of an already-published version becomes a no-op
          # rather than a 400, since PyPI refuses to replace a file.
          skip-existing: true
